# DEMO DATA — the shared item catalog.
#
# Every price here is a plausible Italian trade price, NOT a quoted one. They are
# placeholders until real supplier price lists arrive; see MIGRATION_PLAN.md §1.
# The seed loader expands each item across the suppliers whose categories match,
# applying that supplier's deterministic price bias, so several suppliers can
# quote the same material at different prices — which is the whole point of the
# canvassing view.
#
# `keywords` is what the mock catalog matcher searches. It holds the words a
# tradesperson actually types, including the abbreviations ("mtm" for
# magnetotermico, "corrugato" for tubo corrugato).

