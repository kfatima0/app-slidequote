# WhatsApp message templates, as submitted to Meta for approval.
#
# Templates exist because of one rule: outside a 24-hour window from the last
# inbound message, only pre-approved text may be sent. Inside it, anything.
# Every message this system sends outside that window has to be one of these.
#
# Approval takes days and is per-template, so the wording here is what gets
# submitted and then cannot be changed without resubmitting. Variables are
# numbered {{1}}, {{2}} in the order Twilio substitutes them.
#
# Category matters for pricing and for approval odds. UTILITY is for
# transactional messages about something the user initiated, which all of these
# are; MARKETING would be both wrong and more expensive.
#
# After approval, put the Content SID Twilio issues into `content_sid`. Until
# then the adapter falls back to sending the rendered body as free-form, which
# works in the sandbox and inside the session window.

- name: yquo_supplier_first_contact
  category: UTILITY
  language: it
  content_sid: ""
  # 1: supplier name, 2: material summary, 3: delivery town
  body: |
    Buongiorno {{1}}, siamo YQuo.
    Un nostro cliente ha bisogno di un preventivo per:
    {{2}}
    Consegna a {{3}}.
    Può indicarci prezzo e tempi? Può rispondere qui, anche con un PDF.
  variables: [supplier_name, items_summary, delivery_city]

- name: yquo_supplier_followup
  category: UTILITY
  language: it
  content_sid: ""
  # 1: supplier name, 2: material summary
  body: |
    Buongiorno {{1}}, le ricordo la nostra richiesta di preventivo per:
    {{2}}
    Se preferisce possiamo sentirci al telefono.
  variables: [supplier_name, items_summary]

- name: yquo_quote_ready
  category: UTILITY
  language: it
  content_sid: ""
  # 1: supplier name, 2: total, 3: delivery wording
  body: |
    Miglior prezzo trovato:
    {{1}} — € {{2}}
    {{3}}.
    Risponda *ok* e procedo con l'ordine.
  variables: [supplier_name, total_eur, delivery]

- name: yquo_reminder
  category: UTILITY
  language: it
  content_sid: ""
  body: |
    Le ricordo il preventivo di prima. Procedo con l'ordine?
  variables: []

- name: yquo_order_placed
  category: UTILITY
  language: it
  content_sid: ""
  # 1: supplier name, 2: total, 3: delivery wording
  body: |
    Ordine confermato con {{1}}.
    € {{2}} — {{3}}.
    Le mando l'aggiornamento appena parte la consegna.
  variables: [supplier_name, total_eur, delivery]
