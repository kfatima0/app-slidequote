# DEMO DATA — invented suppliers.
#
# Names, addresses and contact details are fictional. They are shaped like real
# Trentino trade suppliers so the demo reads as plausible to someone from the
# area, but no real business is depicted. Replace with real names and price
# lists once Lorenzo supplies them (MIGRATION_PLAN.md §1).
#
# `behaviour` is MOCK-PHASE ONLY and has no column in the target schema.
#   strategy:  normal | slow | decline | silent | callback
#   price_bias: multiplier on the shared catalog price — how keen this supplier is
#   placement_failure: none | no_ack_first_attempt | never_acks
