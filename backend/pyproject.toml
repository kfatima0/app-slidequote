[project]
name = "voco"
version = "0.1.0"
description = "Voco — mock-first MVP. Italian trade-supply ordering over WhatsApp and voice."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voco"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "TID"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Architectural boundary, enforced again at test time in tests/test_architecture.py.
"voco.adapters".msg = "domain/ and app/ must depend on ports only, never on adapters."

[tool.mypy]
python_version = "3.12"
files = ["src/voco"]
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The domain layer is the strictest tier: it is production code that survives the
# mock -> real migration untouched.
module = ["voco.domain.*", "voco.ports.*"]
disallow_any_generics = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
