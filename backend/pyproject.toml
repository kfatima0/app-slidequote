[project]
name = "yquo"
version = "0.1.0"
description = "YQuo — mock-first MVP. Italian trade-supply ordering over WhatsApp and voice."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "openai==3.7.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart==0.0.32",
    "pyyaml>=6.0",
    "twilio==9.11.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-pyyaml>=6.0.12.20260815",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yquo"]
artifacts = ["src/yquo/seed/fixtures/*.yaml"]

# ruff configuration lives in ../ruff.toml so backend/src and tests/ share one
# config and `yquo` resolves as first-party from both. See that file.

[tool.mypy]
python_version = "3.12"
files = ["src/yquo"]
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Neither SDK ships type information. Their surface is used narrowly and wrapped
# by our own typed ports, so the untyped boundary stops at the adapter.
module = ["twilio.*", "requests.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The domain layer is the strictest tier: it is production code that survives the
# mock -> real migration untouched.
module = ["yquo.domain.*", "yquo.ports.*"]
disallow_any_generics = true
warn_return_any = true

# pytest configuration lives in ../pytest.ini so that the rootdir resolves the
# same way from the repo root and from backend/. See that file.
